# BLE信号強度向上: エンコーダーイベント欠落を軽減（左→右のGATT Notification安定化）
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Deep sleep follows the connection to the right half instead of this half's own input
# (zmk-dax-modules), so ZMK_SLEEP stays off here.
CONFIG_ZMK_DAX_SPLIT_PERIPHERAL_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_BT_BAS=y

# Enable encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_OWN_THREAD=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10

CONFIG_ZMK_POINTING=y
